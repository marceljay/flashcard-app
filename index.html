<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0f2f5;
      --surface: #fff;
      --text: #1a1a2e;
      --text-secondary: #666;
      --text-muted: #999;
      --border: #e0e0e0;
      --border-light: #eee;
      --primary: #6c63ff;
      --primary-hover: #5a52d5;
      --primary-bg: rgba(108,99,255,0.08);
      --primary-ring: rgba(108,99,255,0.15);
      --danger: #ff6b6b;
      --danger-hover: #e55a5a;
      --success: #4ecdc4;
      --success-hover: #3dbdb5;
      --warning: #ffa726;
      --header-bg: #1a1a2e;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 60px rgba(0,0,0,0.3);
      --radius: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--header-bg);
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    header h1 .logo {
      width: 1.5rem;
      height: 1.5rem;
      background: var(--primary);
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    /* Buttons */
    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: var(--radius);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:disabled:active { transform: none; }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }

    .btn-secondary { background: var(--border); color: #333; }
    .btn-secondary:hover:not(:disabled) { background: #d0d0d0; }

    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }

    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: var(--success-hover); }

    .btn-ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.25); }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.1); }

    .btn-outline { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-outline:hover:not(:disabled) { background: var(--bg); }

    .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.75rem; }
    .btn-icon { padding: 0.375rem; font-size: 1rem; line-height: 1; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.15s;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      width: 90%;
      max-width: 500px;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.2s;
    }

    .modal h2 { margin-bottom: 1.25rem; font-size: 1.125rem; }

    .form-group { margin-bottom: 1rem; }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--text-secondary);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-family: inherit;
      transition: border-color 0.2s;
      background: var(--surface);
      color: var(--text);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }

    .form-group textarea { resize: vertical; min-height: 72px; }

    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.25rem; }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 180px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.5rem 0.75rem 0.5rem 2rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.8125rem;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }

    .search-box::before {
      content: "";
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border: 2px solid var(--text-muted);
      border-radius: 50%;
      pointer-events: none;
    }

    .search-box::after {
      content: "";
      position: absolute;
      left: 1.55rem;
      top: 60%;
      width: 2px;
      height: 6px;
      background: var(--text-muted);
      transform: rotate(-45deg);
      pointer-events: none;
    }

    .tag-filter {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
    }

    .tag-pill {
      padding: 0.25rem 0.625rem;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .tag-pill:hover { border-color: var(--primary); color: var(--primary); }
    .tag-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Deck View */
    .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem 2rem; }

    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .deck-header h2 { font-size: 1rem; color: var(--text-secondary); font-weight: 500; }

    .deck-actions { display: flex; gap: 0.5rem; }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
    .empty-state p { font-size: 1rem; margin-bottom: 0.5rem; }
    .empty-state .empty-sub { font-size: 0.8125rem; margin-bottom: 1.5rem; }

    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.75rem;
    }

    .card-item {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      cursor: default;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
      border: 1px solid transparent;
    }

    .card-item:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .card-item .card-tag {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 99px;
      font-size: 0.6875rem;
      font-weight: 500;
      background: var(--primary-bg);
      color: var(--primary);
      margin-bottom: 0.625rem;
    }

    .card-item .card-front {
      font-size: 0.9375rem;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
      margin-bottom: 0.5rem;
    }

    .card-item .card-back {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      line-height: 1.4;
      word-break: break-word;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border-light);
    }

    .card-item .card-actions {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      display: flex;
      gap: 0.125rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card-item:hover .card-actions { opacity: 1; }

    .card-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0.25rem 0.375rem;
      border-radius: 4px;
      line-height: 1;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .card-actions button:hover { background: var(--bg); color: var(--text); }

    /* Study Mode */
    .study-view { display: none; }
    .study-view.active { display: block; }
    .deck-view.hidden { display: none; }

    .study-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .study-top-bar {
      align-self: stretch;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .study-progress {
      align-self: stretch;
      margin-bottom: 2rem;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .study-counter {
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .study-tag {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 99px;
      font-size: 0.6875rem;
      background: var(--primary-bg);
      color: var(--primary);
    }

    .flashcard {
      width: 100%;
      height: 320px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2.5rem;
      text-align: center;
      border: 1px solid var(--border-light);
    }

    .flashcard-face .face-label {
      position: absolute;
      top: 1.25rem;
      left: 1.25rem;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 500;
    }

    .flashcard-front .face-text { font-size: 1.375rem; font-weight: 600; line-height: 1.4; }
    .flashcard-back {
      transform: rotateY(180deg);
    }
    .flashcard-back .face-text { font-size: 1.125rem; color: var(--text-secondary); line-height: 1.5; }

    .flashcard-hint {
      position: absolute;
      bottom: 1.25rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .study-nav {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .study-confidence {
      display: none;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .study-confidence.visible { display: flex; }

    .study-confidence .btn { padding: 0.625rem 1.25rem; font-size: 0.875rem; }

    .kbd {
      display: inline-block;
      padding: 0.125rem 0.375rem;
      border-radius: 3px;
      font-size: 0.625rem;
      font-family: inherit;
      background: rgba(0,0,0,0.06);
      color: var(--text-muted);
      margin-left: 0.375rem;
      vertical-align: middle;
    }

    /* Results screen */
    .results-view { display: none; }
    .results-view.active { display: block; }

    .results-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 3rem 2rem;
      text-align: center;
    }

    .results-container h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .results-container .results-sub { color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.9375rem; }

    .results-stats {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .stat-card {
      flex: 1;
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .stat-card .stat-num { font-size: 2rem; font-weight: 700; }
    .stat-card .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }

    .stat-card.know .stat-num { color: var(--success); }
    .stat-card.learning .stat-num { color: var(--warning); }

    .results-actions { display: flex; gap: 0.75rem; justify-content: center; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* Responsive */
    @media (max-width: 600px) {
      header { padding: 0.75rem 1rem; }
      .container { padding: 1rem; }
      .card-grid { grid-template-columns: 1fr; }
      .study-container { padding: 1rem; }
      .flashcard { height: 280px; }
      .flashcard-front .face-text { font-size: 1.125rem; }
      .toolbar { flex-direction: column; }
      .search-box { min-width: unset; width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1><span class="logo">F</span> Flashcards</h1>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="importBtn" title="Import cards">Import</button>
    <button class="btn btn-ghost btn-sm" id="exportBtn" title="Export cards" disabled>Export</button>
    <button class="btn btn-ghost" id="studyBtn" disabled>Study</button>
    <button class="btn btn-primary" id="addBtn">+ New Card</button>
  </div>
</header>

<!-- Deck View -->
<div class="deck-view" id="deckView">
  <div class="container">
    <div class="deck-header">
      <h2 id="cardCount">0 cards</h2>
      <div class="deck-actions">
        <button class="btn btn-outline btn-sm" id="clearAllBtn" style="display:none">Delete All</button>
      </div>
    </div>

    <div class="toolbar" id="toolbar" style="display:none">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search cards...">
      </div>
      <div class="tag-filter" id="tagFilter"></div>
    </div>

    <div style="margin-top:1rem">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">&#x1F4DA;</div>
        <p>No flashcards yet</p>
        <p class="empty-sub">Create your first card to start studying</p>
        <button class="btn btn-primary" id="addBtnEmpty">+ New Card</button>
      </div>

      <div class="empty-state" id="noResults" style="display:none">
        <p>No cards match your search</p>
      </div>

      <div class="card-grid" id="cardGrid"></div>
    </div>
  </div>
</div>

<!-- Study View -->
<div class="study-view" id="studyView">
  <div class="study-container">
    <div class="study-top-bar">
      <button class="btn btn-outline btn-sm" id="exitStudyBtn">&#8592; Back</button>
      <span class="study-tag" id="studyTag"></span>
    </div>

    <div class="study-progress">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="study-counter" id="studyCounter">1 / 10</span>
        <span class="study-counter" id="studyScore"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="flashcard" id="flashcard">
      <div class="flashcard-inner">
        <div class="flashcard-face flashcard-front">
          <span class="face-label">Question</span>
          <div class="face-text" id="studyFront"></div>
          <div class="flashcard-hint">Click or press Space to flip</div>
        </div>
        <div class="flashcard-face flashcard-back">
          <span class="face-label">Answer</span>
          <div class="face-text" id="studyBack"></div>
          <div class="flashcard-hint">Rate your confidence below</div>
        </div>
      </div>
    </div>

    <div class="study-confidence" id="studyConfidence">
      <button class="btn btn-danger" id="needPracticeBtn">Still Learning <span class="kbd">1</span></button>
      <button class="btn btn-success" id="knowItBtn">Know It <span class="kbd">2</span></button>
    </div>

    <div class="study-nav">
      <button class="btn btn-secondary btn-sm" id="prevBtn">&#8592; Prev <span class="kbd">&#8592;</span></button>
      <button class="btn btn-secondary btn-sm" id="shuffleBtn">Shuffle</button>
      <button class="btn btn-secondary btn-sm" id="nextBtn">Next &#8594; <span class="kbd">&#8594;</span></button>
    </div>
  </div>
</div>

<!-- Results View -->
<div class="results-view" id="resultsView">
  <div class="results-container">
    <h2>Session Complete</h2>
    <p class="results-sub" id="resultsSub">Nice work!</p>
    <div class="results-stats">
      <div class="stat-card know">
        <div class="stat-num" id="resKnow">0</div>
        <div class="stat-label">Know It</div>
      </div>
      <div class="stat-card learning">
        <div class="stat-num" id="resLearning">0</div>
        <div class="stat-label">Still Learning</div>
      </div>
    </div>
    <div class="results-actions">
      <button class="btn btn-secondary" id="resToDeck">Back to Deck</button>
      <button class="btn btn-primary" id="resRetry">Study Again</button>
      <button class="btn btn-outline" id="resRetryMissed" style="display:none">Retry Missed</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">New Flashcard</h2>
    <div class="form-group">
      <label for="frontInput">Front (Question)</label>
      <textarea id="frontInput" placeholder="Enter the question or term..."></textarea>
    </div>
    <div class="form-group">
      <label for="backInput">Back (Answer)</label>
      <textarea id="backInput" placeholder="Enter the answer or definition..."></textarea>
    </div>
    <div class="form-group">
      <label for="tagInput">Tag (optional)</label>
      <input type="text" id="tagInput" placeholder="e.g. Biology, Chapter 3, Vocab...">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h2>Import Flashcards</h2>
    <div class="form-group">
      <label for="importText">Paste JSON or use one-per-line format (front | back | tag)</label>
      <textarea id="importText" style="min-height:120px" placeholder='[{"front":"Q","back":"A","tag":"Math"}]&#10;&#10;or line-by-line:&#10;What is 2+2? | 4 | Math&#10;Capital of Japan? | Tokyo | Geography'></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="importCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="importConfirmBtn">Import</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'flashcards_v2';

  function loadCards() {
    try {
      // Migrate from v1 if needed
      const v1 = localStorage.getItem('flashcards');
      const v2 = localStorage.getItem(STORAGE_KEY);
      if (!v2 && v1) {
        const old = JSON.parse(v1);
        const migrated = old.map(c => ({ ...c, tag: c.tag || '' }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }
      return JSON.parse(v2) || [];
    } catch {
      return [];
    }
  }

  function saveCards(cards) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  }

  let cards = loadCards();
  let editingId = null;
  let studyOrder = [];
  let studyIndex = 0;
  let studyResults = { know: 0, learning: 0, missed: [] };
  let searchQuery = '';
  let activeTag = '';

  // DOM refs
  const $ = id => document.getElementById(id);
  const modal = $('modal');
  const frontInput = $('frontInput');
  const backInput = $('backInput');
  const tagInput = $('tagInput');
  const modalTitle = $('modalTitle');
  const cardGrid = $('cardGrid');
  const cardCount = $('cardCount');
  const emptyState = $('emptyState');
  const noResults = $('noResults');
  const clearAllBtn = $('clearAllBtn');
  const studyBtn = $('studyBtn');
  const exportBtn = $('exportBtn');
  const toolbar = $('toolbar');
  const deckView = $('deckView');
  const studyView = $('studyView');
  const resultsView = $('resultsView');
  const flashcard = $('flashcard');
  const studyFront = $('studyFront');
  const studyBack = $('studyBack');
  const studyCounter = $('studyCounter');
  const studyScore = $('studyScore');
  const studyTag = $('studyTag');
  const studyConfidence = $('studyConfidence');
  const progressFill = $('progressFill');

  function getAllTags() {
    const tags = new Set();
    cards.forEach(c => { if (c.tag) tags.add(c.tag); });
    return [...tags].sort();
  }

  function getFilteredCards() {
    return cards.filter(c => {
      const matchesSearch = !searchQuery ||
        c.front.toLowerCase().includes(searchQuery) ||
        c.back.toLowerCase().includes(searchQuery);
      const matchesTag = !activeTag || c.tag === activeTag;
      return matchesSearch && matchesTag;
    });
  }

  function render() {
    const count = cards.length;
    const filtered = getFilteredCards();

    cardCount.textContent = `${count} card${count !== 1 ? 's' : ''}`;
    emptyState.style.display = count === 0 ? 'block' : 'none';
    clearAllBtn.style.display = count > 0 ? 'inline-block' : 'none';
    studyBtn.disabled = count === 0;
    exportBtn.disabled = count === 0;
    toolbar.style.display = count > 0 ? 'flex' : 'none';

    noResults.style.display = count > 0 && filtered.length === 0 ? 'block' : 'none';

    // Render tag filters
    const tags = getAllTags();
    const tagFilter = $('tagFilter');
    tagFilter.innerHTML = '';
    if (tags.length > 0) {
      const allPill = document.createElement('button');
      allPill.className = `tag-pill${!activeTag ? ' active' : ''}`;
      allPill.textContent = 'All';
      allPill.onclick = () => { activeTag = ''; render(); };
      tagFilter.appendChild(allPill);

      tags.forEach(tag => {
        const pill = document.createElement('button');
        pill.className = `tag-pill${activeTag === tag ? ' active' : ''}`;
        pill.textContent = tag;
        pill.onclick = () => { activeTag = activeTag === tag ? '' : tag; render(); };
        tagFilter.appendChild(pill);
      });
    }

    // Render cards
    cardGrid.innerHTML = '';
    filtered.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card-item';
      el.innerHTML = `
        <div class="card-actions">
          <button onclick="event.stopPropagation(); editCard('${card.id}')" title="Edit">&#9998;</button>
          <button onclick="event.stopPropagation(); deleteCard('${card.id}')" title="Delete">&#10005;</button>
        </div>
        ${card.tag ? `<span class="card-tag">${escapeHtml(card.tag)}</span>` : ''}
        <div class="card-front">${escapeHtml(card.front)}</div>
        <div class="card-back">${escapeHtml(card.back)}</div>
      `;
      cardGrid.appendChild(el);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Modal
  function openModal(card) {
    if (card) {
      editingId = card.id;
      modalTitle.textContent = 'Edit Flashcard';
      frontInput.value = card.front;
      backInput.value = card.back;
      tagInput.value = card.tag || '';
    } else {
      editingId = null;
      modalTitle.textContent = 'New Flashcard';
      frontInput.value = '';
      backInput.value = '';
      tagInput.value = activeTag || '';
    }
    modal.classList.add('active');
    frontInput.focus();
  }

  function closeModal() {
    modal.classList.remove('active');
    editingId = null;
  }

  function saveCard() {
    const front = frontInput.value.trim();
    const back = backInput.value.trim();
    const tag = tagInput.value.trim();
    if (!front || !back) return;

    if (editingId) {
      const card = cards.find(c => c.id === editingId);
      if (card) { card.front = front; card.back = back; card.tag = tag; }
    } else {
      cards.push({ id: crypto.randomUUID(), front, back, tag });
    }

    saveCards(cards);
    closeModal();
    render();
  }

  window.editCard = function(id) {
    const card = cards.find(c => c.id === id);
    if (card) openModal(card);
  };

  window.deleteCard = function(id) {
    if (!confirm('Delete this flashcard?')) return;
    cards = cards.filter(c => c.id !== id);
    saveCards(cards);
    render();
  };

  // Study mode
  function enterStudy(subset) {
    const pool = subset || getFilteredCards();
    if (pool.length === 0) return;

    studyOrder = pool.map(c => cards.indexOf(c));
    studyIndex = 0;
    studyResults = { know: 0, learning: 0, missed: [] };
    flashcard.classList.remove('flipped');
    studyConfidence.classList.remove('visible');

    showView('study');
    renderStudyCard();
  }

  function showView(view) {
    deckView.classList.toggle('hidden', view !== 'deck');
    studyView.classList.toggle('active', view === 'study');
    resultsView.classList.toggle('active', view === 'results');
  }

  function renderStudyCard() {
    const card = cards[studyOrder[studyIndex]];
    studyFront.textContent = card.front;
    studyBack.textContent = card.back;
    studyTag.textContent = card.tag || '';
    studyTag.style.display = card.tag ? 'inline-block' : 'none';
    flashcard.classList.remove('flipped');
    studyConfidence.classList.remove('visible');
    studyCounter.textContent = `${studyIndex + 1} / ${studyOrder.length}`;
    studyScore.textContent = studyResults.know + studyResults.learning > 0
      ? `${studyResults.know} known`
      : '';
    progressFill.style.width = `${((studyIndex + 1) / studyOrder.length) * 100}%`;
  }

  function rateCard(known) {
    if (known) {
      studyResults.know++;
    } else {
      studyResults.learning++;
      studyResults.missed.push(studyOrder[studyIndex]);
    }

    if (studyIndex < studyOrder.length - 1) {
      studyIndex++;
      renderStudyCard();
    } else {
      showResults();
    }
  }

  function showResults() {
    const total = studyResults.know + studyResults.learning;
    const pct = Math.round((studyResults.know / total) * 100);
    $('resKnow').textContent = studyResults.know;
    $('resLearning').textContent = studyResults.learning;

    let sub = '';
    if (pct === 100) sub = 'Perfect score! You know all the cards.';
    else if (pct >= 80) sub = 'Great job! Almost there.';
    else if (pct >= 50) sub = 'Good progress. Keep practicing!';
    else sub = 'Keep going, you\'ll get there!';
    $('resultsSub').textContent = sub;

    $('resRetryMissed').style.display = studyResults.missed.length > 0 ? 'inline-flex' : 'none';

    showView('results');
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Import / Export
  function exportCards() {
    const data = JSON.stringify(cards, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'flashcards.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function openImportModal() {
    $('importText').value = '';
    $('importModal').classList.add('active');
    $('importText').focus();
  }

  function doImport() {
    const text = $('importText').value.trim();
    if (!text) return;

    let imported = [];

    try {
      const parsed = JSON.parse(text);
      if (Array.isArray(parsed)) {
        imported = parsed
          .filter(c => c.front && c.back)
          .map(c => ({ id: crypto.randomUUID(), front: String(c.front), back: String(c.back), tag: String(c.tag || '') }));
      }
    } catch {
      // Try line-by-line: front | back | tag
      const lines = text.split('\n').filter(l => l.trim());
      imported = lines.map(line => {
        const parts = line.split('|').map(s => s.trim());
        if (parts.length >= 2) {
          return { id: crypto.randomUUID(), front: parts[0], back: parts[1], tag: parts[2] || '' };
        }
        return null;
      }).filter(Boolean);
    }

    if (imported.length === 0) {
      alert('No valid cards found. Use JSON or "front | back | tag" format.');
      return;
    }

    cards.push(...imported);
    saveCards(cards);
    $('importModal').classList.remove('active');
    render();
    alert(`Imported ${imported.length} card${imported.length !== 1 ? 's' : ''}.`);
  }

  // Event listeners
  $('addBtn').addEventListener('click', () => openModal());
  $('addBtnEmpty').addEventListener('click', () => openModal());
  $('cancelBtn').addEventListener('click', closeModal);
  $('saveBtn').addEventListener('click', saveCard);
  studyBtn.addEventListener('click', () => enterStudy());
  $('exitStudyBtn').addEventListener('click', () => showView('deck'));

  flashcard.addEventListener('click', () => {
    flashcard.classList.toggle('flipped');
    if (flashcard.classList.contains('flipped')) {
      studyConfidence.classList.add('visible');
    }
  });

  $('knowItBtn').addEventListener('click', () => rateCard(true));
  $('needPracticeBtn').addEventListener('click', () => rateCard(false));

  $('prevBtn').addEventListener('click', () => {
    if (studyIndex > 0) { studyIndex--; renderStudyCard(); }
  });

  $('nextBtn').addEventListener('click', () => {
    if (studyIndex < studyOrder.length - 1) { studyIndex++; renderStudyCard(); }
  });

  $('shuffleBtn').addEventListener('click', () => {
    shuffleArray(studyOrder);
    studyIndex = 0;
    studyResults = { know: 0, learning: 0, missed: [] };
    renderStudyCard();
  });

  clearAllBtn.addEventListener('click', () => {
    if (!confirm('Delete all flashcards? This cannot be undone.')) return;
    cards = [];
    saveCards(cards);
    activeTag = '';
    searchQuery = '';
    $('searchInput').value = '';
    render();
  });

  $('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase();
    render();
  });

  $('importBtn').addEventListener('click', openImportModal);
  exportBtn.addEventListener('click', exportCards);
  $('importCancelBtn').addEventListener('click', () => $('importModal').classList.remove('active'));
  $('importConfirmBtn').addEventListener('click', doImport);

  // Results actions
  $('resToDeck').addEventListener('click', () => showView('deck'));
  $('resRetry').addEventListener('click', () => enterStudy());
  $('resRetryMissed').addEventListener('click', () => {
    const missedCards = studyResults.missed.map(i => cards[i]).filter(Boolean);
    if (missedCards.length > 0) enterStudy(missedCards);
  });

  // Close modals on overlay click
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  $('importModal').addEventListener('click', (e) => { if (e.target === $('importModal')) $('importModal').classList.remove('active'); });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (modal.classList.contains('active')) closeModal();
      else if ($('importModal').classList.contains('active')) $('importModal').classList.remove('active');
      else if (studyView.classList.contains('active')) showView('deck');
    }

    // Only handle study shortcuts if not in a modal or input
    if (!studyView.classList.contains('active')) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === ' ') {
      e.preventDefault();
      flashcard.classList.toggle('flipped');
      if (flashcard.classList.contains('flipped')) studyConfidence.classList.add('visible');
    }
    if (e.key === 'ArrowLeft' && studyIndex > 0) { studyIndex--; renderStudyCard(); }
    if (e.key === 'ArrowRight' && studyIndex < studyOrder.length - 1) { studyIndex++; renderStudyCard(); }

    // Confidence ratings
    if (flashcard.classList.contains('flipped')) {
      if (e.key === '1') rateCard(false);
      if (e.key === '2') rateCard(true);
    }
  });

  // Enter to save in modals
  frontInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); backInput.focus(); } });
  backInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); tagInput.focus(); } });
  tagInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveCard(); } });

  render();
</script>

</body>
</html>
